<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>RoyalScanner</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #07111f;
    color: #eef4ff;
    font-family: Arial, sans-serif;
}

header {
    padding: 18px 20px;
    border-bottom: 1px solid #203047;
    background: #0a1525;
}

h1 {
    margin: 0;
    font-size: 25px;
}

.badge {
    display: inline-block;
    margin-top: 8px;
    padding: 6px 10px;
    border-radius: 8px;
    background: #123b2a;
    color: #65e6a0;
    font-size: 12px;
    font-weight: bold;
}

.wrap {
    max-width: 1100px;
    margin: auto;
    padding: 16px;
}

.controls {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 12px;
}

select,
button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #30445e;
    background: #101d2f;
    color: white;
    font-weight: bold;
}

button {
    background: #f5c44e;
    color: #111;
    cursor: pointer;
    grid-column: span 4;
}

.status {
    padding: 10px;
    border-radius: 8px;
    background: #101d2f;
    margin-bottom: 12px;
    font-size: 13px;
}

.live {
    color: #65e6a0;
}

.wait {
    color: #ffd166;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 12px;
}

.card {
    background: #101d2f;
    border: 1px solid #203047;
    border-radius: 10px;
    padding: 12px;
}

.label {
    font-size: 11px;
    color: #8fa3bd;
}

.value {
    font-size: 18px;
    margin-top: 5px;
}

.chartbox {
    background: #091321;
    border: 1px solid #263a54;
    border-radius: 12px;
    padding: 10px;
}

.charttitle {
    display: flex;
    justify-content: space-between;
    padding: 5px 5px 10px;
    font-size: 14px;
}

canvas {
    width: 100%;
    height: 430px;
    display: block;
    background: #08111e;
    border-radius: 8px;
}

.result {
    margin-top: 14px;
    background: #101d2f;
    border: 1px solid #203047;
    border-radius: 10px;
    padding: 15px;
}

.result h2 {
    margin: 0 0 10px;
    font-size: 17px;
}

.green {
    color: #65e6a0;
}

.yellow {
    color: #ffd166;
}

.small {
    font-size: 12px;
    color: #8fa3bd;
}

@media(max-width:700px) {

    .controls {
        grid-template-columns: 1fr 1fr;
    }

    button {
        grid-column: span 2;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    canvas {
        height: 360px;
    }
}
</style>
</head>

<body>

<header>

    <h1>RoyalScanner</h1>

    <div class="badge">
        ANALYSIS ONLY • NO EXECUTION
    </div>

</header>

<div class="wrap">

    <div class="controls">

        <select id="market">
            <option value="gold">XAUUSD — Gold</option>
            <option value="nas100">NAS100</option>
            <option value="us30">US30</option>
        </select>

        <select id="mode">
            <option value="real">Real Market</option>
            <option value="demo">Demo Market</option>
        </select>

        <select id="tf">
            <option>M1</option>
            <option selected>M5</option>
            <option>M15</option>
            <option>H1</option>
            <option>H4</option>
        </select>

        <select id="strategy">
            <option>CRT + 714</option>
            <option>CRT</option>
            <option>714 Method</option>
        </select>

        <button id="scan">
            SCAN CHART
        </button>

    </div>

    <div class="status" id="status">
        Connecting to MT5...
    </div>

    <div class="stats">

        <div class="card">
            <div class="label">BID</div>
            <div class="value" id="bid">—</div>
        </div>

        <div class="card">
            <div class="label">ASK</div>
            <div class="value" id="ask">—</div>
        </div>

        <div class="card">
            <div class="label">SPREAD</div>
            <div class="value" id="spread">—</div>
        </div>

        <div class="card">
            <div class="label">CANDLES</div>
            <div class="value" id="count">0</div>
        </div>

    </div>

    <div class="chartbox">

        <div class="charttitle">

            <strong id="chartTitle">
                XAUUSD • M5 • LIVE
            </strong>

            <span class="small" id="updated">
                Waiting for data...
            </span>

        </div>

        <canvas id="chart"></canvas>

    </div>

    <div class="result">

        <h2>Scanner Result</h2>

        <div id="resultText" class="yellow">
            WAIT — waiting for CRT/714 confirmation.
        </div>

        <p class="small">
            RoyalScanner analyzes market data only.
            It does not execute trades.
        </p>

    </div>

</div>

<script>

const API =
"https://royalscanner-bridge.fxnicole031120.workers.dev/";

const canvas =
document.getElementById("chart");

const ctx =
canvas.getContext("2d");

const marketNames = {

    gold: "XAUUSD",

    nas100: "NAS100",

    us30: "US30"

};


function resizeCanvas() {

    const rect =
    canvas.getBoundingClientRect();

    const dpr =
    window.devicePixelRatio || 1;

    canvas.width =
    rect.width * dpr;

    canvas.height =
    rect.height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


function drawCandles(candles) {

    const W =
    canvas.clientWidth;

    const H =
    canvas.clientHeight;

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.fillStyle =
    "#08111e";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    if (!candles || candles.length === 0) {

        ctx.fillStyle =
        "#8fa3bd";

        ctx.font =
        "14px Arial";

        ctx.fillText(
            "Waiting for live MT5 candle data...",
            20,
            30
        );

        return;

    }


    const visible =
    candles.slice(-80);


    let low =
    Infinity;

    let high =
    -Infinity;


    visible.forEach(c => {

        low =
        Math.min(low, c.low);

        high =
        Math.max(high, c.high);

    });


    const padding =
    (high - low) * 0.08 || 1;

    low -= padding;
    high += padding;


    const left =
    55;

    const right =
    15;

    const top =
    15;

    const bottom =
    30;


    const chartWidth =
    W - left - right;

    const chartHeight =
    H - top - bottom;


    const candleWidth =
    chartWidth / visible.length;


    const bodyWidth =
    Math.max(
        2,
        candleWidth * 0.58
    );


    function priceToY(price) {

        return top +
        ((high - price) /
        (high - low)) *
        chartHeight;

    }


    /* GRID */

    ctx.strokeStyle =
    "#17283d";

    ctx.lineWidth =
    1;


    for (
        let i = 0;
        i <= 5;
        i++
    ) {

        const y =
        top +
        chartHeight *
        i / 5;

        ctx.beginPath();

        ctx.moveTo(
            left,
            y
        );

        ctx.lineTo(
            W - right,
            y
        );

        ctx.stroke();


        const price =
        high -
        ((high - low) *
        i / 5);


        ctx.fillStyle =
        "#6f829b";

        ctx.font =
        "10px Arial";

        ctx.fillText(
            price.toFixed(2),
            5,
            y + 3
        );

    }


    /* CANDLES */

    visible.forEach(
        (candle, index) => {

            const x =
            left +
            index *
            candleWidth +
            candleWidth / 2;


            const openY =
            priceToY(
                candle.open
            );

            const closeY =
            priceToY(
                candle.close
            );

            const highY =
            priceToY(
                candle.high
            );

            const lowY =
            priceToY(
                candle.low
            );


            const bullish =
            candle.close >=
            candle.open;


            if (bullish) {

                ctx.strokeStyle =
                "#49d17d";

                ctx.fillStyle =
                "#49d17d";

            } else {

                ctx.strokeStyle =
                "#ff5c5c";

                ctx.fillStyle =
                "#ff5c5c";

            }


            /* WICK */

            ctx.lineWidth =
            1;

            ctx.beginPath();

            ctx.moveTo(
                x,
                highY
            );

            ctx.lineTo(
                x,
                lowY
            );

            ctx.stroke();


            /* BODY */

            const bodyTop =
            Math.min(
                openY,
                closeY
            );

            const bodyHeight =
            Math.max(
                1,
                Math.abs(
                    closeY -
                    openY
                )
            );


            ctx.fillRect(
                x -
                bodyWidth / 2,
                bodyTop,
                bodyWidth,
                bodyHeight
            );

        }
    );


    /* TIME LABELS */

    ctx.fillStyle =
    "#6f829b";

    ctx.font =
    "10px Arial";


    const first =
    visible[0];

    const last =
    visible[visible.length - 1];


    if (first && first.time) {

        const firstTime =
        new Date(
            first.time * 1000
        ).toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


        ctx.fillText(
            firstTime,
            left,
            H - 8
        );

    }


    if (last && last.time) {

        const lastTime =
        new Date(
            last.time * 1000
        ).toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


        ctx.fillText(
            lastTime,
            W - 70,
            H - 8
        );

    }

}


async function loadLiveData() {

    const mode =
    document.getElementById(
        "mode"
    ).value;


    const market =
    document.getElementById(
        "market"
    ).value;


    const timeframe =
    document.getElementById(
        "tf"
    ).value;


    document.getElementById(
        "chartTitle"
    ).textContent =
    marketNames[market] +
    " • " +
    timeframe +
    " • " +
    (
        mode === "real"
        ? "LIVE"
        : "DEMO"
    );


    if (mode === "demo") {

        document.getElementById(
            "status"
        ).innerHTML =
        '<span class="wait">DEMO MARKET</span> — live feed disabled.';

        drawCandles([]);

        return;

    }


    try {

        const response =
        await fetch(
            API +
            "?t=" +
            Date.now(),
            {
                cache: "no-store"
            }
        );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const json =
        await response.json();


        const symbolData =
        json?.data?.[market];


        if (!symbolData) {

            document.getElementById(
                "status"
            ).innerHTML =
            '<span class="wait">WAITING</span> — no market data received.';

            drawCandles([]);

            return;

        }


        const candles =
        symbolData
        ?.timeframes
        ?.[timeframe] || [];


        document.getElementById(
            "bid"
        ).textContent =
        Number(
            symbolData.bid
        ).toFixed(2);


        document.getElementById(
            "ask"
        ).textContent =
        Number(
            symbolData.ask
        ).toFixed(2);


        document.getElementById(
            "spread"
        ).textContent =
        (
            Number(symbolData.ask) -
            Number(symbolData.bid)
        ).toFixed(2);


        document.getElementById(
            "count"
        ).textContent =
        candles.length;


        document.getElementById(
            "updated"
        ).textContent =
        json.data.updated
        ?
        new Date(
            json.data.updated
        ).toLocaleTimeString()
        :
        "LIVE";


        document.getElementById(
            "status"
        ).innerHTML =
        '<span class="live">● LIVE MT5 FEED CONNECTED</span> — real OHLC candles received.';


        drawCandles(
            candles
        );


    } catch (error) {

        document.getElementById(
            "status"
        ).innerHTML =
        '<span class="wait">CONNECTION ERROR</span> — ' +
        error.message;


        drawCandles([]);

    }

}


document.getElementById(
    "scan"
).addEventListener(
    "click",
    function() {

        document.getElementById(
            "resultText"
        ).innerHTML =
        '<span class="yellow">WAIT — scanning CRT + 714 conditions. No trade execution.</span>';

        loadLiveData();

    }
);


[
    "market",
    "mode",
    "tf",
    "strategy"
].forEach(
    function(id) {

        document
        .getElementById(id)
        .addEventListener(
            "change",
            loadLiveData
        );

    }
);


loadLiveData();


setInterval(
    loadLiveData,
    2000
);

</script>

</body>
</html>
